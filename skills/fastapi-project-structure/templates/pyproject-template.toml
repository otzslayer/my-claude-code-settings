[project]
name = "{{PROJECT_NAME}}"
version = "1.0.0"
description = "FastAPI application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "ty>=0.0.63",
]
mcp = [
    "mcp>=1.0.0",
]
db = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",  # For PostgreSQL
]
auth = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# python-coding-style 스킬의 기준 설정. 두 곳이 어긋나면 스킬이 원본이다.
[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modern syntax)
    "N",    # pep8-naming
    "S",    # bandit (security)
    "SIM",  # simplification
    "ARG",  # unused arguments
    "B",    # flake8-bugbear
    "C4",   # comprehension optimizations
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S603",  # subprocess call — 오탐 과다
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI·Typer의 인자 기본값 호출은 의도된 패턴 (B008을 통째로 끄지 않는다)
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header",
    "typer.Argument", "typer.Option",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S106", "SIM117", "ARG001", "E741"]

[tool.ty]
# 기본 설정 사용 (uv run ty check)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
