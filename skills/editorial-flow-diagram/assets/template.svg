<!--
  Editorial flow diagram TEMPLATE (transparent-ready).
  One of each node type + broken-line labels + legend. Copy and extend.
  - Nodes centered at x=380 on a 760-wide canvas.
  - Node centers 132px apart: Start 126, step1 258, step2 390, End 522.
  - No full-canvas background rect and no header => renders transparent.
  - Labelled connectors are split into two <line> segments (gap ~±9px around
    the label) so the arrow never runs through the label text.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 78 760 540"
     font-family="Pretendard,'Pretendard Variable','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141413"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#141413" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- connectors (split around labels) -->
  <g stroke="#141413" stroke-width="1.6" fill="none">
    <!-- Start -> step 1 (label "input" at y=187) -->
    <line x1="380" y1="154" x2="380" y2="178"/>
    <line x1="380" y1="196" x2="380" y2="220" marker-end="url(#arrow)"/>
    <!-- step 1 -> step 2 (label at y=324) -->
    <line x1="380" y1="296" x2="380" y2="315"/>
    <line x1="380" y1="333" x2="380" y2="352" marker-end="url(#arrow)"/>
    <!-- step 2 -> End (label at y=461) -->
    <line x1="380" y1="428" x2="380" y2="452"/>
    <line x1="380" y1="470" x2="380" y2="494" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels (centered on the connector midpoints) -->
  <g font-size="12.5" fill="#55534B" text-anchor="middle">
    <text x="380" y="191">input</text>
    <text x="380" y="328">intermediate result</text>
    <text x="380" y="465">final result</text>
  </g>

  <!-- Start (terminator) -->
  <rect x="290" y="98" width="180" height="56" rx="28" fill="#C9755A" filter="url(#soft)"/>
  <text x="380" y="131" text-anchor="middle" font-size="17" font-weight="600" fill="#FBF9F4">Start</text>

  <!-- 1. process node -->
  <rect x="210" y="220" width="340" height="76" rx="14" fill="#FBFAF6" stroke="#141413" stroke-width="1.5" filter="url(#soft)"/>
  <circle cx="210" cy="258" r="15" fill="#C9755A"/>
  <text x="210" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#FBF9F4">1</text>
  <text x="380" y="254" text-anchor="middle" font-size="17" font-weight="600" fill="#141413">Process step</text>
  <text x="380" y="276" text-anchor="middle" font-size="12.5" fill="#6E6B60">One-line role for this step</text>

  <!-- 2. check node (validation / gate) -->
  <rect x="210" y="352" width="340" height="76" rx="14" fill="#F4E4DC" stroke="#C9755A" stroke-width="1.8" filter="url(#soft)"/>
  <circle cx="210" cy="390" r="15" fill="#C9755A"/>
  <text x="210" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#FBF9F4">2</text>
  <text x="380" y="386" text-anchor="middle" font-size="17" font-weight="600" fill="#141413">Check step</text>
  <text x="380" y="408" text-anchor="middle" font-size="12.5" fill="#8A5A48">A validation the reader should notice</text>

  <!-- End (terminator) -->
  <rect x="290" y="494" width="180" height="56" rx="28" fill="#C9755A" filter="url(#soft)"/>
  <text x="380" y="527" text-anchor="middle" font-size="17" font-weight="600" fill="#FBF9F4">End</text>

  <!-- legend -->
  <g font-size="12" fill="#6E6B60">
    <rect x="210" y="584" width="16" height="16" rx="4" fill="#F4E4DC" stroke="#C9755A" stroke-width="1.6"/>
    <text x="234" y="596">Check step</text>
    <rect x="360" y="584" width="16" height="16" rx="4" fill="#FBFAF6" stroke="#141413" stroke-width="1.4"/>
    <text x="384" y="596">Processing step</text>
  </g>
</svg>
